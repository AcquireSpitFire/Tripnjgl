<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tripnjungle</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<div class="header_inner">
			<a href="index.html">‹ Zurück zur Übersicht</a>
			<h1 id="titel">Tripnjungle</h1>
			<p id="theme"></p>
		</div>
	</header>

	<main>
		<!-- Slideshow: Deckblatt + alle Bilder/Videos der Ausstellung -->
		<div id="slideshow" class="slideshow exhibition_slideshow">

			<button id="prev" class="nav prev" aria-label="Vorheriges Bild">‹</button>

			<div id="slide_content" class="slide_content"></div>

			<button id="next" class="nav next" aria-label="Nächstes Bild">›</button>

			<div id="dots"></div>

		</div>

		<p id="description"></p>

		<div id="galerie" class="galerie"></div>

		<!-- Intro-Video der Ausstellung, zum erneuten Anschauen (unter den Fotos) -->
		<section id="video" class="video_section" hidden>
			<h2 class="section_title">Video</h2>
			<div id="video_box" class="video_box"></div>
		</section>
	</main>

	<!-- Vollbild-Ansicht: öffnet sich beim Klick auf ein Bild -->
	<div id="viewer" class="viewer" hidden>
		<button id="viewer_close" class="viewer_close" aria-label="Schließen">×</button>
		<img id="viewer_image" alt="">
	</div>
    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/exhibition.js"></script>
</body>
</html>
