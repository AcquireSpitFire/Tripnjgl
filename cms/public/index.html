<!DOCTYPE html>
<html lang="en" class="fit">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tripnjungle</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<div class="header_inner">
			<h1>Tripnjungle</h1>
		</div>
	</header>

	<main>
		<p>Welcome to Tripnjungle.</p>
		<!-- Poster der nächsten Ausstellung. Bleibt versteckt, wenn keine geplant ist. -->
		<div id="front_poster" class="poster" hidden></div>
        <div id="slideshow" class="slideshow">

            <button id="prev" class="nav prev">‹</button>

            <div id="slide_content" class="slide_content"></div>

            <button id="next" class="nav next">›</button>

            <div id="dots"></div>

        </div>
		<!-- Alle kommenden Poster, nach Datum sortiert. Versteckt, wenn keine geplant sind. -->
		<div id="upcoming_posters" class="upcoming" hidden></div>
	</main>
    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
