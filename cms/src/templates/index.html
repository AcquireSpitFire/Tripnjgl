<!DOCTYPE html>
<html lang="en" class="fit">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{title}}</title>
	<meta name="description" content="{{description}}">
	<meta name="robots" content="{{robots}}">
	<link rel="canonical" href="{{canonical}}">
	<meta property="og:site_name" content="{{siteName}}">
	<meta property="og:type" content="website">
	<meta property="og:title" content="{{title}}">
	<meta property="og:description" content="{{description}}">
	<meta property="og:url" content="{{canonical}}">
	<meta property="og:image" content="{{ogImage}}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{title}}">
	<meta name="twitter:description" content="{{description}}">
	<meta name="twitter:image" content="{{ogImage}}">
	<meta name="theme-color" content="#000000">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="preconnect" href="https://www.youtube-nocookie.com">
	<link rel="preconnect" href="https://www.youtube.com">
	<link rel="preconnect" href="https://i.ytimg.com">
	<link rel="stylesheet" href="/css/style.css">
	{{{jsonLd}}}
</head>
<body>
	<header>
		<div class="header_inner">
			<h1>Tripnjungle</h1>
		</div>
	</header>

	<main>
		<p>Welcome to Tripnjungle.</p>
		<!-- Poster der nächsten Ausstellung. Bleibt versteckt, wenn keine geplant ist. -->
		<div id="front_poster" class="poster" hidden></div>
		<div id="slideshow" class="slideshow">

			<button id="prev" class="nav prev" aria-label="Previous">‹</button>

			<div id="slide_content" class="slide_content"></div>

			<button id="next" class="nav next" aria-label="Next">›</button>

			<div id="dots"></div>

		</div>
		<!-- Alle kommenden Poster, nach Datum sortiert. Versteckt, wenn keine geplant sind. -->
		<div id="upcoming_posters" class="upcoming" hidden></div>
	</main>

	<footer class="site_footer">
		<nav aria-label="Footer">
			<a href="/exhibitions">Exhibitions</a>
			<a href="/events">Events</a>
			<a href="/archive">Archive</a>
			<a href="/about">About</a>
		</nav>
	</footer>

	<script defer src="/js/data.js"></script>
	<script defer src="/js/nav.js"></script>
	<script defer src="/js/intro.js"></script>
	<script defer src="/js/script.js"></script>
</body>
</html>
