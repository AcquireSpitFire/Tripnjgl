<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{title}}</title>
	<meta name="description" content="{{description}}">
	<meta name="robots" content="{{robots}}">
	<link rel="canonical" href="{{canonical}}">
	<meta property="og:site_name" content="{{siteName}}">
	<meta property="og:type" content="article">
	<meta property="og:title" content="{{title}}">
	<meta property="og:description" content="{{description}}">
	<meta property="og:url" content="{{canonical}}">
	<meta property="og:image" content="{{ogImage}}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{title}}">
	<meta name="twitter:description" content="{{description}}">
	<meta name="twitter:image" content="{{ogImage}}">
	<meta name="theme-color" content="#000000">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="stylesheet" href="/css/style.css">
	{{{jsonLd}}}
</head>
<body>
	<header>
		<div class="header_inner">
			<a href="/">‹ Back to overview</a>
			<h1 id="titel">Tripnjungle</h1>
			<p id="theme"></p>
		</div>
	</header>

	<main>
		<!-- Slideshow: Deckblatt + alle Bilder/Videos der Ausstellung -->
		<div id="slideshow" class="slideshow exhibition_slideshow">

			<button id="prev" class="nav prev" aria-label="Previous image">‹</button>

			<div id="slide_content" class="slide_content"></div>

			<button id="next" class="nav next" aria-label="Next image">›</button>

			<div id="dots"></div>

		</div>

		<p id="description"></p>

		<div id="galerie" class="galerie"></div>

		<!-- Intro-Video der Ausstellung, zum erneuten Anschauen (unter den Fotos) -->
		<section id="video" class="video_section" hidden>
			<h2 class="section_title">Video</h2>
			<div id="video_box" class="video_box"></div>
		</section>
	</main>

	<footer class="site_footer">
		<nav aria-label="Footer">
			<a href="/">Home</a>
			<a href="/exhibitions">Exhibitions</a>
			<a href="/events">Events</a>
			<a href="/archive">Archive</a>
			<a href="/about">About</a>
			<a href="/imprint">Legal notice</a>
			<a href="/privacy">Privacy</a>
		</nav>
	</footer>

	<!-- Vollbild-Ansicht: öffnet sich beim Klick auf ein Bild -->
	<div id="viewer" class="viewer" hidden>
		<button id="viewer_close" class="viewer_close" aria-label="Close">×</button>
		<img id="viewer_image" alt="">
	</div>

	<script defer src="/js/data.js"></script>
	<script defer src="/js/nav.js"></script>
	<script defer src="/js/intro.js"></script>
	<script defer src="/js/exhibition.js"></script>
</body>
</html>
